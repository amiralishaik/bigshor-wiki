name: Build BIGSHOR WIKI installable packages

on:
  push:
    branches:
      - development/quality-gates-v34.10.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-installers.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: bigshor-wiki-installers
          path: dist/*.zip
          if-no-files-found: error
