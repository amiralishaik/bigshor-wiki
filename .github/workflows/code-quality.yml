name: BIGSHOR WIKI code quality
# Article Studio editor checks run against the Core-bundled assets.

on:
  push:
    branches:
      - development/**
  pull_request:
    branches:
      - BIGSHOR-WIKI
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsw-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} lint and regression tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint all PHP source files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find Plugins Themes -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found under Plugins/ or Themes/." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check Themes/bigshor-wiki-parent/assets/wiki-enhancements.js
          node --check Plugins/bigshor-wiki-admin-ui/assets/admin-ux-v15.js
          node --check Plugins/bigshor-wiki-admin-ui/assets/admin-white-label.js
          node --check Plugins/BIGSHOR_WIKI_CORE_v34.10.0/assets/article-studio.js

      - name: Run standalone core regression tests
        shell: bash
        run: |
          set -euo pipefail
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase54-template-engine-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase63-static-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase56-editorial-workflows-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase51-cidr-security-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/theme-plugin-integration-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/tools-hub-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/article-studio-core-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase45-article-layout-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase4-infobox-media-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase5-knowledge-navigation-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase6-article-quality-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase7-revision-history-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase8-article-community-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase9-advanced-article-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase10-article-discovery-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase11-article-hardening-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase12-article-release-regression.php
          php Plugins/BIGSHOR_WIKI_CORE_v34.10.0/tests/phase6-citation-management-regression.php
          php Themes/bigshor-wiki-parent/tests/article-page-regression.php


  package-core:
    name: Package BIGSHOR WIKI Core v34.12.0
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build installable Core ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/BIGSHOR_WIKI_CORE_v34.12.0.zip Plugins/BIGSHOR_WIKI_CORE_v34.10.0

      - name: Upload Core ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BIGSHOR_WIKI_CORE_v34.12.0
          path: dist/BIGSHOR_WIKI_CORE_v34.12.0.zip
          if-no-files-found: error
          retention-days: 14
